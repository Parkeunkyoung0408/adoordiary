name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Vercel Deploy Hook
        if: ${{ vars.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ vars.VERCEL_DEPLOY_HOOK }}"

      - name: Deploy hook not configured
        if: ${{ vars.VERCEL_DEPLOY_HOOK == '' }}
        run: |
          echo "VERCEL_DEPLOY_HOOK repository variable is not set."
          echo "Create a Deploy Hook in Vercel (Settings → Git → Deploy Hooks) and add the URL as a GitHub Actions variable named VERCEL_DEPLOY_HOOK."
